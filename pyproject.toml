[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cardbox"
version = "1.0.0"
description = "Card-box based context management core library."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["cardbox", "cards", "context", "llm", "postgres"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "boto3>=1.42.6",
    "httpx",
    "instructor",
    "litellm",
    "pydantic>=2,<3",
    "pydantic-settings>=2.0.3",
    "psycopg[binary]",
    "psycopg-pool",
    "requests",
    "tenacity==9.1.2",
    "typing_extensions",
    "uuid6",
]

[project.urls]
Homepage = "https://github.com/Intelligent-Internet/CG-Cardbox"
Repository = "https://github.com/Intelligent-Internet/CG-Cardbox"
Issues = "https://github.com/Intelligent-Internet/CG-Cardbox/issues"

[project.scripts]
cardbox = "cardbox.demo:main"

[project.optional-dependencies]
test = [
    "respx==0.22.0",
]
interactions = [
    "google-genai",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cardbox*"]

[tool.setuptools.package-data]
"cardbox" = ["adapters/*.sql"]
