name: publish

on:
  push:
    tags:
      - "v*"

jobs:
  build_release_artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      artifact_name: ${{ steps.artifact_name.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Validate tagged commit is on main
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Resolve release tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "${tag}" != v* ]]; then
            echo "expected tag starting with 'v', got: ${tag}" >&2
            exit 1
          fi
          echo "release_tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Resolve artifact name
        id: artifact_name
        run: echo "name=dist-${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}

      - name: Build distributions
        env:
          PYTHONWARNINGS: >-
            ignore::UserWarning:vcs_versioning._backends._git,
            ignore::UserWarning:vcs_versioning.overrides
        run: uv build --no-sources

      - name: Check package metadata
        run: uv run --with twine python -m twine check dist/*

      - name: Capture built wheel path
        id: wheel
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib

          wheels = sorted(pathlib.Path("dist").glob("cardbox-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected exactly one wheel in dist/, found {len(wheels)}")
          print(f"wheel_path={wheels[0]}")
          PY

      - name: Verify built version matches tag
        run: |
          python - <<'PY'
          import os
          import pathlib

          wheel_name = pathlib.Path(os.environ["WHEEL_PATH"]).name
          version = wheel_name.removeprefix("cardbox-").split("-py3", 1)[0]
          tag = os.environ["RELEASE_TAG"].removeprefix("v")
          if version != tag:
              raise SystemExit(f"wheel version {version!r} does not match tag {tag!r}")
          print(f"validated release version {version}")
          PY
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          WHEEL_PATH: ${{ steps.wheel.outputs.wheel_path }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: dist/*
          if-no-files-found: error

  publish_pypi:
    needs: build_release_artifacts
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build_release_artifacts.outputs.artifact_name }}
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish_github_release:
    needs:
      - build_release_artifacts
      - publish_pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build_release_artifacts.outputs.artifact_name }}
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build_release_artifacts.outputs.release_tag }}
          generate_release_notes: true
          files: |
            dist/*
