name: package-check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Build distributions
        run: uv build --no-sources

      - name: Check package metadata
        run: uv run --with twine python -m twine check dist/*

      - name: Smoke import wheel
        run: |
          uv run --with dist/cardbox-*.whl --no-project -- \
            python -c "import cardbox; print(cardbox.__name__)"
